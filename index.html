<!DOCTYPE html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>[AI-Lab] 情報入口</title>
<style>body{font-family:-apple-system,"Microsoft JhengHei","PingFang TC",sans-serif;background:#f4f6f8;margin:0;padding:16px;color:#222}.wrap{max-width:720px;margin:0 auto}.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:10px;border-left:5px solid #1a73e8;box-shadow:0 1px 3px rgba(0,0,0,.06);display:flex;gap:12px}.txt{flex:1;min-width:0}.thumb{width:120px;flex:none;align-self:flex-start;border-radius:8px;overflow:hidden}.thumb img{width:120px;height:90px;object-fit:cover;display:block}.t{font-size:16px;font-weight:bold;margin:4px 0}.d{font-size:13px;color:#444}.meta{font-size:12px;color:#1a73e8;font-weight:bold}.tag{font-size:11px;font-weight:bold;padding:2px 8px;border-radius:10px;margin-left:6px}.loc{background:#e8f0fe;color:#1a73e8}.btn{display:inline-block;background:#1a73e8;color:#fff;text-decoration:none;font-size:13px;padding:7px 14px;border-radius:8px;margin-top:8px}#count{font-size:13px;color:#666;padding:4px}</style></head>
<body><div class="wrap">
<h2 style="margin:4px 0 12px;">[AI-Lab] 情報入口</h2>
<div id="count"></div><div id="list"><p>載入中…</p></div>
<script>
const SITES=[
{id:"tech-news",t:"[AI-Lab] 近期 keynote・演講・研討會（EE／CS）",d:"資訊工程、電機工程、AI、半導體、通訊領域研討會與演講，每週一更新。",short:"EE/CS"},
{id:"contest-news",t:"[AI-Lab] 創新實作・程式競賽・創業計畫",d:"黑客松、程式競賽、創業挑戰賽與實作展覽，每週一更新。",short:"競賽"},
{id:"activity-news",t:"[AI-Lab] 成人學習・成長・交流・交友",d:"工作坊、讀書會、成長課程、聯誼交友（台南・高雄），每週一更新。",short:"成長"}];
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function ph(short){const s='<svg xmlns="http://www.w3.org/2000/svg" width="120" height="90"><rect width="120" height="90" fill="#1a3a6b"/><text x="8" y="50" font-size="16" font-weight="bold" fill="#ffffff" font-family="sans-serif">'+short+'</text><text x="8" y="72" font-size="9" fill="#6b8fc7" font-family="sans-serif">AI-Lab</text></svg>';return "data:image/svg+xml;utf8,"+encodeURIComponent(s);}
async function load(){
const cards=await Promise.all(SITES.map(async s=>{
let n=0,mx="—",cover=null,firstTitle="";
try{const r=await fetch("/"+s.id+"/events.json");if(r.ok){const j=await r.json();n=j.length;for(const e of j){if(e.added&&e.added>mx)mx=e.added;if(!firstTitle&&e.title)firstTitle=e.title;if(!cover&&e.img)cover=e.img;}}}catch(e){}
const img=cover||ph(s.short);
return '<div class="card"><div class="txt"><div class="meta">'+mx+'｜共 '+n+' 場 <span class="tag loc">'+esc(s.short)+'</span></div><div class="t">'+esc(s.t)+'</div><div class="d">'+esc(s.d)+(firstTitle?'<br>最新：'+esc(firstTitle.slice(0,24)):'')+'</div><a class="btn" href="/'+s.id+'/">進入</a></div><div class="thumb"><a href="/'+s.id+'/"><img loading="lazy" src="'+esc(img)+'" alt="" onerror="this.onerror=null;this.src=\''+ph(s.short)+'\'"></a></div></div>';}));
document.getElementById("count").textContent="三館情報，點卡進入";
document.getElementById("list").innerHTML=cards.join("");
}
load();
</script></div></body></html>
